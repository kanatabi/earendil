name: release
# The deploy pipeline — triggered BY A RELEASED TAG. The approved semver job
# in ci.yml pushes vX.Y.Z via RELEASE_BOT_PAT specifically so this fires
# (a GITHUB_TOKEN-pushed tag never cascades — silent no-deploy). The optional
# manual run re-deploys an EXISTING tag: rollback without a revert.
on:
  push:
    tags: ['/^v[0-9]+\.[0-9]+\.[0-9]+$/']
  workflow_dispatch:
    inputs:
      tag:
        description: existing v-tag to build + deploy (redeploy / rollback)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: kanatabi/anvil/actions/publish-image@7183eb2808bc82d05eef7cc427c239802463f432 # v2 approval cascade
        with:
          app: earendil
          tag: ${{ inputs.tag || github.ref_name }}
          alias: latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: deploy-bump
        uses: kanatabi/anvil/actions/deploy-bump@7183eb2808bc82d05eef7cc427c239802463f432 # v2 approval cascade
        with:
          app: earendil
          tag: ${{ inputs.tag || github.ref_name }}
          vortex-bot-pat: ${{ secrets.VORTEX_BOT_PAT }}
