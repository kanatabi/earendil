name: ci
# Gates on PRs; main additionally runs THE acceptance test (live-vs-twin
# contract against real lumen + Postgres + Meilisearch). Merging gates —
# it never deploys by itself; a human approving ONE of the three semver
# jobs below is the release decision (see release.yml for the deploy).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # NEVER let a pipeline queue behind an open one (walked 2026-11-14: the
  # shared ci-refs/heads/main group made every new release cycle wait until
  # the previous cycle's still-open run was cancelled by hand — its leftover
  # release-* parks kept it open forever). Main pushes get a UNIQUE group
  # (github.sha): runs never queue. PR runs keep a per-PR group with
  # cancel-in-progress: a new commit supersedes its OWN run's older revision
  # — same pipeline, not a rival one. Parks on the release-*/deploy-*
  # environments COEXIST by GitHub design (environments don't serialize
  # deployments): whichever chain the human approves continues — owner
  # ruling 2026-11-14, "whichever pipeline the developer wants to continue
  # is their call" — and GitHub's own 30-day park auto-fail is the only
  # janitor. No cancelling, no reaping, no machine judgment.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint # prettier --check + eslint, standalone per the lesson
      - run: npm run check # svelte-check must be 0/0
      - run: npm run test:unit # offline suites — zero-backend by doctrine
      - run: npm run build

  contract:
    # the program's first rule, executed: lumen serves BlogApi's exact shapes.
    # Not a mock of a mock — real lumen, real Postgres, real engine, seeded
    # corpus; the twin is the expected value.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres:16.6
        env:
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen-dev
          POSTGRES_DB: lumen
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lumen" --health-interval 5s --health-timeout 5s --health-retries 20
      meili:
        image: getmeili/meilisearch:v1.56.1
        env:
          MEILI_MASTER_KEY: dev-meili-key
          MEILI_ENV: development
        ports: ['7700:7700']
        options: >-
          --health-cmd "curl -sf http://localhost:7700/health || exit 1" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kanatabi/lumen
          path: .lumen-src
      - uses: actions/setup-go@v5
        with:
          go-version-file: .lumen-src/go.mod
      - name: seed the corpus
        working-directory: .lumen-src
        env:
          LUMEN_DB_URL: postgres://lumen:lumen-dev@localhost:5432/lumen?sslmode=disable
          LUMEN_MEILI_URL: http://localhost:7700
          LUMEN_MEILI_KEY: dev-meili-key
        run: go run ./cmd/seed
      - name: run lumen (server role)
        working-directory: .lumen-src
        env:
          LUMEN_DB_URL: postgres://lumen:lumen-dev@localhost:5432/lumen?sslmode=disable
          LUMEN_MEILI_URL: http://localhost:7700
          LUMEN_MEILI_KEY: dev-meili-key
          LUMEN_SESSION_JWT_SECRET: contract-session-secret-32-bytes!!
        run: |
          go run ./cmd/lumen server &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/readyz >/dev/null && exit 0; sleep 1; done
          echo "lumen never became ready"; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: live-vs-mock contract suite
        run: LUMEN_URL=http://localhost:8080 npx vitest run src/lib/api/contract.spec.ts

  # semver-patch: approval-gated release. Waits on the PROTECTED
  # environment `release-patch` until a human approves THIS job —
  # approving IS the release decision; the bump level is literal,
  # nothing derived. Environments are NEVER shared between bump jobs:
  # one environment approval releases EVERY job waiting on it (proven
  # live 2026-11-13). No Waiting badge => this env lost protection
  # (fail-open) — fix Settings → Environments before trusting releases.
  semver-patch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gates, contract]
    runs-on: ubuntu-latest
    environment: release-patch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: kanatabi/anvil/actions/semver-release@6e210f5c232a17273d59da7766fbb9f5d2d25d56 # guarded push/create + optional-tag dispatch
        with:
          bump: patch
          release-bot-pat: ${{ secrets.RELEASE_BOT_PAT }}

  # semver-minor: approval-gated release. Waits on the PROTECTED
  # environment `release-minor` until a human approves THIS job —
  # approving IS the release decision; the bump level is literal,
  # nothing derived. Environments are NEVER shared between bump jobs:
  # one environment approval releases EVERY job waiting on it (proven
  # live 2026-11-13). No Waiting badge => this env lost protection
  # (fail-open) — fix Settings → Environments before trusting releases.
  semver-minor:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gates, contract]
    runs-on: ubuntu-latest
    environment: release-minor
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: kanatabi/anvil/actions/semver-release@6e210f5c232a17273d59da7766fbb9f5d2d25d56 # guarded push/create + optional-tag dispatch
        with:
          bump: minor
          release-bot-pat: ${{ secrets.RELEASE_BOT_PAT }}

  # semver-major: approval-gated release. Waits on the PROTECTED
  # environment `release-major` until a human approves THIS job —
  # approving IS the release decision; the bump level is literal,
  # nothing derived. Environments are NEVER shared between bump jobs:
  # one environment approval releases EVERY job waiting on it (proven
  # live 2026-11-13). No Waiting badge => this env lost protection
  # (fail-open) — fix Settings → Environments before trusting releases.
  semver-major:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gates, contract]
    runs-on: ubuntu-latest
    environment: release-major
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: kanatabi/anvil/actions/semver-release@6e210f5c232a17273d59da7766fbb9f5d2d25d56 # guarded push/create + optional-tag dispatch
        with:
          bump: major
          release-bot-pat: ${{ secrets.RELEASE_BOT_PAT }}
